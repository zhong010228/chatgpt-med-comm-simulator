<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>评分统计</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <h1>评分统计结果</h1>
  <table>
    <thead>
      <tr>
        <th>学号</th>
        <th>姓名</th>
        <th>提交时间</th>
        <th>对话内容</th>
        <th>评分</th>
        <th>评分意见</th>
      </tr>
    </thead>
    <tbody>
      {% if feedback_data %}
        {% for row in feedback_data %}
          <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
            <td>{{ row[5] }}</td>
          </tr>
        {% endfor %}
      {% else %}
        <tr>
          <td colspan="6">暂无评分数据。</td>
        </tr>
      {% endif %}
    </tbody>
  </table>
</body>
</html>
